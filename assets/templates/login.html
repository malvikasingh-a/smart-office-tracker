{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Office Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'login-style.css' %}">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center v-100 mt-5">
        <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
            <div class="card-header bg-navy text-white text-center py-3">
                <h4 class="mb-0">Portal Login</h4>
            </div>
            <div class="card-body p-4">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">User Type</label>
                        <select class="form-select" id="userType" required>
                            <option value="" selected disabled>Select Role</option>
                            <option value="Employee">Employee</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="text" class="form-control" id="email" placeholder="Email or Username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-white border-0 pb-4">
                <a href="{% url 'homepage' %}" class="text-decoration-none small text-muted">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="{% static 'login-script.js' %}"></script>
</body>
</html>
