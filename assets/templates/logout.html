{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | Smart Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'logout.css' %}">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 text-center">
                <div class="card border-0 shadow-lg p-5 rounded-4 animate-fade-in">
                    <div class="logout-icon-wrapper mb-4">
                        <i class="bi bi-shield-check text-success display-1"></i>
                    </div>
                    
                    <h2 class="fw-bold text-dark mb-2">Successfully Logged Out</h2>
                    <p class="text-muted">Thank you for using <span class="fw-bold text-navy">Smart Office Tracker</span>. Your session has been securely closed.</p>
                    
                    <hr class="my-4 opacity-25">
                    
                    <div class="d-flex align-items-center justify-content-center mb-3">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        <span class="small text-muted">Redirecting to login page...</span>
                    </div>

                    <a href="{% url 'login' %}" class="btn btn-navy w-100 py-2 fw-bold mt-2">Login Again Now</a>
                </div>
                <p class="mt-4 text-muted small">&copy; 2026 Smart Office Asset Management</p>
            </div>
        </div>
    </div>

    <script src="{% static 'logout.js' %}?v=999"></script>
</body>
</html>
