{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Request Approval | Smart Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'request-style.css' %}">
</head>
<body class="bg-light">

<div class="d-flex" id="wrapper">
    <nav class="sidebar-navy shadow" id="sidebar-wrapper">
        <div class="sidebar-header p-4 mb-2">
            <h3 class="text-white fw-bold mb-0">Smart Office</h3>
        </div>
        
        <ul class="nav flex-column px-2">
            <li class="nav-item mb-1">
                <a href="{% url 'ab-admin' %}" class="nav-link py-3 px-4 d-flex align-items-center opacity-75">
                    <i class="bi bi-speedometer2 me-3 fs-5"></i> Dashboard
                </a>
            </li>
            <li class="nav-item mb-1">
                <a href="{% url 'inventory' %}" class="nav-link py-3 px-4 d-flex align-items-center opacity-75">
                    <i class="bi bi-box-seam me-3 fs-5"></i> Inventory
                </a>
            </li>
            <li class="nav-item mb-1">
                <a href="{% url 'add-asset' %}" class="nav-link py-3 px-4 d-flex align-items-center opacity-75">
                    <i class="bi bi-plus-square me-3 fs-5"></i> Add-Asset
                </a>
            </li>   
            <li class="nav-item mb-1">
                <a href="{% url 'tickets' %}" class="nav-link py-3 px-4 d-flex align-items-center opacity-75">
                    <i class="bi bi-tools me-3 fs-5"></i> Tickets & Maintenance
                </a>
            </li>
            <li class="nav-item mb-1">
                <a href="{% url 'report' %}" class="nav-link py-3 px-4 d-flex align-items-center opacity-75">
                    <i class="bi bi-file-earmark-bar-graph me-3 fs-5"></i> Reports
                </a>
            </li>
            <li class="nav-item mb-1">
                <a href="#" class="nav-link active py-3 px-4 d-flex align-items-center rounded shadow-sm">
                    <i class="bi bi-chat-left-dots me-3 fs-5"></i> Requests
                </a>
            </li>
            <li class="nav-item mb-1">
                <a href="{% url 'users' %}" class="nav-link py-3 px-4 d-flex align-items-center opacity-75">
                    <i class="bi bi-people me-3 fs-5"></i> Users Management
                </a>
            </li>
        </ul>
    </nav>

    <div class="flex-grow-1 main-content">
        <header class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center sticky-top">
            <h4 class="fw-bold mb-0 text-slate-900">Pending Asset Requests</h4>
            <span class="badge bg-indigo-soft text-indigo p-2 px-3 rounded-pill" id="requestCountBadge">3 Requests Waiting</span>
        </header>

        <div class="p-4" id="requestContainer">
            
        </div>        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'request-logic.js' %}?v=1"></script>
</body>
</html>
